[workspace]
resolver = "3"
members = [
  "crates/ferrochart-form",
  "crates/ferrochart-compile",
  "crates/ferrochart-overlay",
  "crates/ferrochart-cdr",
  "crates/ferrochart-term",
  "crates/ferrochart-server",
  "app/ferrochart-renderer",
  "app/ferrochart",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
authors = ["Ruben Talstra"]
repository = "https://github.com/rubentalstra/FerroCHART"
homepage = "https://ferrochart.eu"
publish = false

# The openEHR model layer (docs/architecture.md §2). These crates model the
# specification and are published on crates.io; the CDR they are published
# from is never a dependency here. The line releases in lockstep, so the
# versions move together and docs/VERSIONS.md is the matrix.
[workspace.dependencies]
openehr-base = "0.0.61"
openehr-rm = "0.0.61"
openehr-am = "0.0.61"
openehr-adl = "0.0.61"
openehr-its = "0.0.61"
openehr-query = "0.0.61"

# The ITS-REST client (docs/architecture.md section 8, issue #22). rustls
# rather than the platform TLS stack, and no default features, which is the
# pin the family already uses. `http` carries StatusCode so a status is
# compared as a type rather than as a number (.claude/rules/rust-style.md).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
http = "1.5.0"
url = "2.5.8"

# The server surface (docs/architecture.md section 11, issue #41).
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

# Test-only. `.claude/rules/testing.md` names insta as the snapshot tool, and
# `cargo insta review` as how a change to one is read before it is accepted.
insta = { version = "1.48.0", features = ["json"] }

# Test-only. `.claude/rules/testing.md` names wiremock as the HTTP mock for
# both upstreams, so a status, a header and a body are asserted against a real
# socket rather than against a hand-rolled stub of our own client.
wiremock = "0.6.5"

ferrochart-form = { path = "crates/ferrochart-form" }
ferrochart-compile = { path = "crates/ferrochart-compile" }
ferrochart-overlay = { path = "crates/ferrochart-overlay" }
ferrochart-cdr = { path = "crates/ferrochart-cdr" }
ferrochart-term = { path = "crates/ferrochart-term" }
ferrochart-server = { path = "crates/ferrochart-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

# Every lint here is enforced by `.claude/rules/reliability.md`. `forbid`
# cannot be relaxed by an attribute; `deny` fails every clippy run.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
ambiguous_negative_literals = "deny"
# A guard bound to `_` is dropped at once; this lives in the rustc set.
let_underscore_drop = "deny"
# A mistyped lint name is a warning that `-D warnings` does not catch, so a
# whole rule could sit in this table doing nothing.
unknown_lints = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"

# No panicking indexing on a request path. Clinical text is multi-byte, so a
# string slice on a byte boundary is a live crash.
indexing_slicing = "deny"
string_slice = "deny"

# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
integer_division = "warn"

# Guards, results and causes are never dropped on the floor.
let_underscore_lock = "deny"
unused_result_ok = "deny"

# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"

# Libraries speak tracing; only a binary writes to stdio.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Suppressions carry their reason, so a stale one is visible.
allow_attributes_without_reason = "deny"

# Safety comments belong to unsafe code, which this workspace forbids.
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

# Compile-time API bans live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"

# Async correctness.
await_holding_lock = "deny"

[profile.release]
# A clean 500 from the HTTP layer relies on catch_unwind, which only catches
# unwinding panics, and Cargo documents that tests ignore this setting, so an
# abort regression would be untestable by construction.
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

# The renderer ships to a browser, so it optimises for size rather than speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
