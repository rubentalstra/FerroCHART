# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.
#
# The workspace landed in #11, so the analyzer runs its Rust analysis and
# imports coverage alongside the multi-language sweep over shell, YAML, JSON
# and markdown-adjacent config.

sonar.projectKey=rubentalstra_FerroCHART
sonar.organization=rubentalstra
sonar.projectName=FerroCHART
sonar.sourceEncoding=UTF-8

# Scope: analyze the tree, minus build output, any vendored input, and the
# generated model subtree. A vendored tree is bytes a publisher owns and a
# fetch script reproduces (.claude/rules/vendored-inputs.md), so a finding on
# one is noise nobody may act on in place. A generated tree, when there is one,
# is the emitter's output, so its correctness belongs to the generator rather
# than to hand review (.claude/rules/codegen.md), and its path joins the list
# here at the same time as the emitter.
sonar.sources=.
sonar.exclusions=**/target/**,**/vendor/**,docs/specs/**,**/node_modules/**

# Rust coverage, imported from the instrumented nextest run
# .github/workflows/sonar.yml writes.
sonar.rust.lcov.reportPaths=lcov.info

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version, never kept as a second hand-maintained copy here.
