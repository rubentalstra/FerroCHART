# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. cargo deny check advisories reads the same
# RustSec database cargo audit does and adds yanked, licenses, bans and
# sources, so there is no separate cargo-audit job.

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly, dated, and each
# naming the event that deletes it.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences a BUSL-1.1 project can depend on (and that its Apache 2.0
# Change License admits). Copyleft is not allowed by default; a weak-copyleft
# dependency gets a crate-scoped exceptions entry with its reason.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE), and so are three of the
# pinned openEHR model crates. The names below are the workspace members of
# the root Cargo.toml and the crates docs/VERSIONS.md pins; nothing else.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "ferrochart" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-form" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-compile" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-overlay" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-cdr" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-term" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-server" },
  { allow = ["BUSL-1.1"], crate = "ferrochart-renderer" },
  { allow = ["BUSL-1.1"], crate = "openehr-adl" },
  { allow = ["BUSL-1.1"], crate = "openehr-query" },
  # openehr-its is BUSL-1.1 AND Apache-2.0 for the openEHR-derived material
  # it embeds.
  { allow = ["BUSL-1.1", "Apache-2.0"], crate = "openehr-its" },
  # openehr-term embeds the openEHR support terminology, which the openEHR
  # Foundation publishes under CC-BY-SA-3.0. It reaches this tree through
  # openehr-its and openehr-adl, never as a direct dependency.
  { allow = ["Apache-2.0", "CC-BY-SA-3.0"], crate = "openehr-term" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version, which never reaches a
# registry. External wildcards stay denied.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
