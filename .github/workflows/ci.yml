# CI in two tiers.
#
#   1. The workflow, shell, container and guard tier runs NOW, on a repository
#      with no code: zizmor over .github, actionlint over .github/workflows,
#      shellcheck over the tracked shell programs, hadolint over any
#      Dockerfile, and the committed comment-style, versions and docs-shots
#      guards. These keep this very file honest, so none of them may depend on
#      Rust existing.
#   2. The Rust tier is gated behind a detection job that looks for a root
#      Cargo.toml. Every cargo lane is skipped cleanly until the workspace
#      lands and then activates by itself, with no workflow edit. hashFiles()
#      cannot gate a job at `if:` time, because the workspace is empty before
#      checkout, so a real detection job is the correct primitive.
#
# The `conclusion` job is the single required status check on main; it is what
# makes a mostly-skipped pipeline enforceable (docs/ci-cd.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request only. A push to main and a
  # merge-group run each verify a distinct commit that must keep its own
  # result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default: each job grants its own.
permissions: {}

jobs:
  # ---- Tier 1: the checks that run on a repository with no code -------------

  # zizmor (https://docs.zizmor.sh/) is the static security analysis for GitHub
  # Actions, the machine check behind three properties this repository treats
  # as hard rules: every `uses:` pinned to a commit SHA (unpinned-uses), no
  # checkout persisting credentials (artipacked), and no context value spliced
  # into a shell (template-injection).
  #
  # The audit path is the whole of .github, not just the workflows: zizmor also
  # reads dependabot.yml (dependabot-cooldown) and composite actions under
  # .github/actions, which run with the calling workflow's permissions and are
  # the same class of live, token-holding code (#34).
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: zizmor@1.29.0
      - name: Audit .github
        # GH_TOKEN enables the online audits. impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  # actionlint is the correctness half of the pair: `${{ }}` expressions that
  # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
  # labels, and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned. actionlint is a Go binary rather
        # than a crate, and its README's alternative is `curl | bash` off main,
        # the unpinned fetch the pinning rule forbids. The image also bundles
        # shellcheck, which half of actionlint's value depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a printf format or a jq filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell programs: the CI guards, the tracker
  # helpers, and the hooks. `--severity=style` is the lowest floor, so every
  # finding gates. A finding is fixed, or it carries a per-line
  # `# shellcheck disable=SCnnnn` directive with its reason. There is no
  # .shellcheckrc, deliberately: nothing may turn a code off tree-wide
  # (.claude/rules/ci-cd.md).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream release binary, pinned by version, rather than the
      # runner's distro package, which moves at every runner-image refresh.
      # Fetched by the same SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang, which covers the git hooks. A
          # NUL-delimited pipe, so a path with a space survives.
          {
            git ls-files -z '*.sh'
            git ls-files -z | while IFS= read -r -d '' f; do
              case "$f" in
                *.*) ;;
                *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                     && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
              esac
            done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # hadolint over every tracked Dockerfile, under the committed .hadolint.yaml
  # (failure-threshold: warning). No Dockerfile exists yet, so the step reports
  # that and passes; it gains teeth the moment a container recipe lands.
  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every tracked Dockerfile passes hadolint
        # The official image, digest-pinned, for the same reason as actionlint:
        # hadolint is a Haskell binary with no checksum-verified installer in
        # the pinned tool set.
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(git ls-files -z 'Dockerfile' '*/Dockerfile' '*.Dockerfile' 'Dockerfile.*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile to check"
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config .hadolint.yaml "${files[@]}"

  # The comment-style guard (.claude/rules/comments.md, RFC 505 and RFC 1574)
  # over the whole tree. It reads .rs files only, so it reports "no files to
  # check" today and gates from the first hand-written source file.
  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # The version-drift guard. It compares every present config file against
  # docs/VERSIONS.md and skips loudly for the files that have not landed yet,
  # so it is useful now and grows teeth as files appear.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/versions.sh

  # The book's screenshots. They are written by the end-to-end battery, and
  # this guard is what stops a blank, stray or orphaned one from being
  # committed. It reads the committed images and the book's markdown, so it
  # needs no cargo and no browser.
  docs-shots:
    name: docs-shots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/docs-shots.sh

  # CHANGELOG.md keeps the shape Keep a Changelog 1.1.0 gives it. Every pull
  # request adds an entry, and pasting a fresh heading above the old one is
  # the easy way to do that; this refuses the second one.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/changelog.sh

  # The published site agrees with the tree it describes. The landing page is
  # what a hospital reads before deciding whether to try the thing, and it went
  # three releases out of date with a figure nobody had re-measured (#196).
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/site.sh

  # ---- Tier 2: the Rust lanes, gated on the workspace existing --------------

  # The one job that decides whether the cargo tier runs at all: it checks out
  # and looks for a root Cargo.toml. Every Rust job below `needs` it.
  detect:
    name: detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present: the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml: the Rust lanes are skipped (repository in its design phase)."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest
      # The ADL 2 archetype library is fetched rather than committed, because
      # its files state no licence (corpus/archetypes/adl2/PROVENANCE.md).
      # FERROCHART_REQUIRE_ADL2 below turns its absence into a failure, so a
      # fetch that stops working is a red build rather than a silently skipped
      # suite.
      - run: scripts/vendor/adl2-archetypes.sh
      - run: cargo nextest run --workspace --locked --no-tests=pass
        env:
          FERROCHART_REQUIRE_ADL2: "1"
      # nextest does not run doctests, so they get their own compile.
      - run: cargo test --doc --workspace --locked

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory database as cargo-audit and adds
      # yanked, licences, bans and sources, so there is no separate audit job.
      - run: cargo deny check

  # The first-party dependency-closure guard. ferrochart-form is the published
  # contract, so it links no other crate of this tree, and the renderer links
  # ferrochart-form alone (docs/architecture.md sections 10 and 11). It reads
  # the resolved graph, so it needs cargo.
  crate-closure:
    name: crate-closure
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/crate-closure.sh

  # The serde_json feature guard. Cargo features are additive across a build
  # graph, so one dependency can change how every crate here serializes, and
  # one already did: the form definition stopped deserializing when a new
  # dependency turned on arbitrary_precision. It reads the resolved graph, so
  # it needs cargo.
  serde-json-features:
    name: serde-json-features
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/serde-json-features.sh

  # The renderer. It ships to a browser, so it is checked on the target it
  # ships to: wasm32-unknown-unknown is the only place a dependency that
  # cannot compile for a browser shows up. The bundle is built, measured
  # against its budget, and the design system's own gates run beside it.
  renderer:
    name: renderer
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The bundle budget reads its baseline out of the merge base, so the
          # history has to be there.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy,rustfmt
          cache-key: renderer
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: trunk@0.21.14, cargo-nextest
      # install-action has no leptosfmt recipe and would fall back to
      # cargo-binstall guessing an asset name, so this one is a cargo install
      # at the version docs/VERSIONS.md pins.
      - name: Install leptosfmt
        run: cargo install leptosfmt --locked --version 0.1.33
      - name: Formatting, including the view macros
        run: |
          set -euo pipefail
          cargo fmt -p ferrochart-renderer --check
          leptosfmt --check app/ferrochart-renderer/src
      - name: Clippy on the target the crate ships to
        run: >-
          cargo clippy -p ferrochart-renderer --locked
          --target wasm32-unknown-unknown --all-targets --all-features
          -- -D warnings
      # The configuration a release actually ships: without the style guide.
      # The default build is the one linted above, so without this step the
      # bundle a clinician downloads would be the one nothing lints.
      - name: Clippy on the configuration a release ships
        run: >-
          cargo clippy -p ferrochart-renderer --locked
          --target wasm32-unknown-unknown --all-targets --no-default-features
          -- -D warnings
      - name: Tests, including the token contrast gate
        run: cargo nextest run -p ferrochart-renderer --locked --no-tests=pass
      - name: Every screen styles against the semantic tokens
        run: bash scripts/checks/palette-utilities.sh
      # --no-default-features drops the living style guide, which a clinician
      # does not download (#154).
      - name: Build the release bundle
        working-directory: app/ferrochart-renderer
        run: trunk build --release --locked --no-default-features
      - name: The bundle is inside its ceiling and its per-change budget
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE:-}" ]]; then
            bash scripts/checks/bundle-size.sh --base "$BASE"
          else
            bash scripts/checks/bundle-size.sh --verify-recorded
          fi

  # The browser journeys. scripts/ui-e2e.sh owns everything it drives: it
  # stages two committed CKM templates, starts the server over them, serves
  # the renderer bundle, and runs a pinned Chromium in a container beside
  # them. The journeys live outside the workspace (e2e/Cargo.toml records
  # why), so they get their own formatting and clippy run here rather than
  # riding along with the workspace lanes.
  ui-e2e:
    name: ui-e2e
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy,rustfmt
          cache-key: ui-e2e
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: trunk@0.21.14, cargo-nextest
      - name: The journeys keep the same bar as the workspace
        run: |
          set -euo pipefail
          cargo fmt --manifest-path e2e/Cargo.toml --check
          cargo clippy --manifest-path e2e/Cargo.toml --locked --all-targets -- -D warnings
      - name: The journeys
        run: bash scripts/ui-e2e.sh
      # The capture pass is the one thing that writes into the checkout, and
      # this run never asks for it, so a run that changed a tracked file, or
      # left an image behind, has a defect in it (issue #93).
      - name: A battery run changed no tracked file and left no image behind
        run: |
          set -euo pipefail
          git diff --exit-code
          stray="$(git status --porcelain --untracked-files=all -- website/book/src)"
          if [[ -n "$stray" ]]; then
            echo "the battery left this behind under website/book/src:"
            echo "$stray"
            exit 1
          fi
      - name: What a failing journey was looking at
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-failures
          path: target/ui-e2e-failures
          if-no-files-found: ignore

  # The only lane that can falsify the product's central promise: a CDR
  # rejecting a COMPOSITION FerroCHART built and validated is always a
  # FerroCHART bug (CLAUDE.md). Every other Rust lane judges FerroCHART
  # against FerroCHART.
  #
  # `scripts/test-cdr.sh` starts the demo profile of the release's own
  # compose.yaml, so what is tested against is the artefact a downloader runs,
  # and it runs the `#[ignore]`d live cases of ferrochart-cdr and
  # ferrochart-server against it.
  cdr:
    name: cdr (the round trip against a real CDR)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cdr
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest
      - name: The round trip against a real CDR
        run: bash scripts/test-cdr.sh

  msrv:
    name: msrv (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version,
      # which it reads from the workspace `rust-version`.
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Also gated on the workspace, so it stays
    # quiet while the repository has no manifest.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a pull request that introduces a vulnerable or
          # disallowed-licence dependency. The licence policy mirrors
          # deny.toml once that file exists.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check -------------------------------------------

  # conclusion is the one status check the branch ruleset requires. It `needs`
  # every other job and runs on always(), so it reports even when every gated
  # Rust lane is skipped. It fails when a needed job failed or was cancelled
  # and passes when every result is success or skipped. The results arrive
  # through env:, never spliced into run: (.claude/rules/ci-cd.md).
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - dockerfile-lint
      - comment-style
      - versions
      - docs-shots
      - changelog
      - site
      - detect
      - fmt
      - clippy
      - test
      - doc
      - cargo-deny
      - crate-closure
      - serde-json-features
      - renderer
      - ui-e2e
      - cdr
      - msrv
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
