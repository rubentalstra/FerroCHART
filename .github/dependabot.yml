# .github/dependabot.yml: automated dependency updates.
#
# Two ecosystems. `github-actions` bumps the digest-pinned actions the workflows
# in this directory use. `docker` bumps the digest-pinned base image of
# `docker/Dockerfile`, and it is listed from the change that landed that file:
# Dependabot errors on an ecosystem whose manifest is absent rather than
# skipping it, so an entry never arrives before its manifest. The `cargo` entry
# lands the same way, with the change that opts the workspace into it.
#
# The sibling image tags in `compose.yaml` are not a Dependabot subject. They
# name products released from other repositories, and `scripts/checks/versions.sh`
# is what keeps the FerroCHART tag in that file equal to the workspace version.
#
# COOLDOWN is the delay between a release being published and this bot
# proposing it, so a compromised or yanked release has a window to be caught
# before it reaches a pull request (the OWASP CI/CD Security Cheat Sheet's
# third-party-code control). Every entry sits at 7 days or more, the floor
# zizmor's `dependabot-cooldown` audit enforces, and the audit runs over this
# file in CI.
#
# SECURITY updates are exempt by design: Dependabot applies no cooldown to
# advisory-driven bumps, so an advisory still arrives immediately. That is what
# makes a cooldown safe rather than a delay on getting fixes.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # `semver-major-days` is not accepted for this ecosystem, so `default-days`
    # covers every bump. A week costs nothing here: the schedule is weekly
    # anyway and a security bump ignores the cooldown.
    cooldown:
      default-days: 7
    groups:
      # ONE weekly PR for every minor and patch action bump (one codeql-action
      # release alone opens three PRs, one per sub-action). MAJORS stay
      # individual: a breaking action major is a real review, and burying one
      # in a batch is how it gets rubber-stamped.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  # The base image of docker/Dockerfile, pinned by index digest. A bump is a
  # digest change with the tag comment beside it, which is the same review a
  # pinned action bump gets.
  - package-ecosystem: "docker"
    directory: "/docker"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
