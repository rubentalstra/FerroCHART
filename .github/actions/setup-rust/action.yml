name: Set up Rust
description: >-
  Install the toolchain pinned in rust-toolchain.toml and restore the build
  cache. The calling job checks out the repository FIRST: a local action path
  (./.github/actions/setup-rust) resolves only after checkout, so this action
  does not check out.

  This action is for the gating lanes. A publishing lane installs the toolchain
  itself with caching off, because a cache an untrusted run could poison must
  not feed a release (.claude/rules/ci-cd.md).
inputs:
  components:
    description: >-
      Comma-separated extra rustup components, for example clippy, rustfmt, or
      llvm-tools-preview. Empty installs no extra component.
    required: false
    default: ""
  cache-key:
    description: >-
      Extra string mixed into the build-cache key, to keep one job's cache
      separate from another's.
    required: false
    default: ""
  cache-shared-key:
    description: >-
      A cache key shared across jobs, for a lane that wants one entry rather
      than one per job. Empty leaves the default per-job key.
    required: false
    default: ""
  cache-save-if:
    description: >-
      Whether this job may write the cache, as a string the action evaluates.
      A lane that only reads passes "false".
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml when
    # it is present, which is where the channel is pinned and what
    # scripts/checks/versions.sh checks against docs/VERSIONS.md. Caching is
    # built in and keyed by the cache-key input.
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        components: ${{ inputs.components }}
        cache-key: ${{ inputs.cache-key }}
        cache-shared-key: ${{ inputs.cache-shared-key }}
        cache-save-if: ${{ inputs.cache-save-if }}
