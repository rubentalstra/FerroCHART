[package]
name = "ferrochart-server"
description = "The FerroCHART HTTP surface: compiles, validates, builds and commits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# The renderer bundle rides inside the binary, so Trunk runs before the server
# builds. A fresh clone has no `dist/`, so the feature is off by default and
# the release lane turns it on.
ui = []

[dependencies]
axum.workspace = true
ferrochart-cdr.workspace = true
ferrochart-compile.workspace = true
ferrochart-compose.workspace = true
ferrochart-form.workspace = true
ferrochart-validate.workspace = true
openehr-rm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
openehr-base.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
wiremock.workspace = true

[lints]
workspace = true
