[package]
name = "ferrochart-renderer"
description = "The FerroCHART form renderer, a browser binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "ferrochart-renderer"
path = "src/main.rs"

# The living style guide is a build-time surface for whoever works on the kit,
# and it costs 51506 gzipped bytes of a clinician's download (#154), so a
# release bundle is built --no-default-features and does not carry it. It is ON
# by default because every other build wants it: a cargo build then draws every
# affordance the kit defines, so an affordance nothing draws is a dead-code
# error rather than a silence.
[features]
default = ["design"]
design = []

[dependencies]
console_error_panic_hook.workspace = true
ferrochart-form.workspace = true
gloo-net.workspace = true
icondata_core.workspace = true
icondata_lu.workspace = true
leptos.workspace = true
leptos_icons.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "DomTokenList",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "Node",
  "NodeList",
  "Storage",
  "Window",
] }

[lints]
workspace = true
