<!-- The 1200x630 social card. Iron ground, the mark and the wordmark, what the
     product does, and the status, because there is no binary to download and
     the card must not imply one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FerroCHART: an openEHR form builder and renderer, in Rust">
  <title>FerroCHART</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#C2185B"/>

  <g transform="translate(96,150) scale(2.1)" fill="none" stroke-linecap="round">
    <rect x="9" y="7" width="46" height="50" rx="7" stroke="#E04F84" stroke-width="4"/>
    <path d="M19 20 H45" stroke="#E04F84" stroke-width="4"/>
    <path d="M19 29 H39" stroke="#F48FB1" stroke-width="4"/>
    <path d="M19.5 40 L24.5 45 L33 36.5" stroke="#E04F84" stroke-width="4.6" stroke-linejoin="round"/>
  </g>

  <text x="256" y="248" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-1" fill="#f1f5f9">FerroCHART</text>

  <text x="96" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="500" fill="#CBD5E1">An openEHR form builder and renderer, in Rust.</text>
  <text x="96" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="500" fill="#8593A8">Operational templates in, forms out, compositions into any CDR.</text>

  <g transform="translate(96,470)">
    <rect x="0" y="0" width="290" height="64" rx="14" fill="#221523" stroke="#C2185B" stroke-width="2"/>
    <circle cx="32" cy="32" r="8" fill="#E04F84"/>
    <text x="54" y="41" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">In design phase</text>
  </g>
  <text x="410" y="511" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#64748B">No binary yet. The architecture is the work.</text>

  <text x="1104" y="592" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#64748B">ferrochart.eu</text>
</svg>
