<!-- Favicon master: the rows and the tick in mist on a rose tile. The sheet
     outline is dropped here, because a rounded rect inside a rounded tile
     turns to mush at 16 px. The intrinsic size stays 32, because a favicon
     wants a small natural size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FerroCHART">
  <title>FerroCHART</title>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#C2185B"/>
  <g fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 10 H24" stroke-width="2.8"/>
    <path d="M8 16 H20" stroke-width="2.8"/>
    <path d="M8.5 22 L11.5 25 L17 19.5" stroke-width="3"/>
  </g>
</svg>
