[book]
title = "FerroCHART"
authors = ["FerroCHART contributors"]
description = "Documentation for FerroCHART, a pure-Rust openEHR form builder and renderer."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
# The tab icon is a theme override: mdBook copies theme/favicon.svg and
# theme/favicon.png into the build output and links them from every page. Both
# come from assets/brand (assets/brand/README.md).
#
# The book is published under /docs/, with the landing page at the site root
# (scripts/site/assemble.sh). site-url makes the book's asset, search index,
# and 404 links absolute under that prefix, which is also what lets one 404
# page work from both depths. The cost is that `mdbook serve` alone cannot
# render the book correctly; assemble the site and serve that instead.
site-url = "/docs/"
default-theme = "rust"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/rubentalstra/FerroCHART"
# mdBook 0.5.4 expands {path} to the path under the book root, which already
# begins with src/, so the template stops at the book directory.
edit-url-template = "https://github.com/rubentalstra/FerroCHART/edit/main/website/book/{path}"

[output.html.search]
enable = true

# A table of contents where a chapter carries a `<!-- toc -->` marker.
[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
